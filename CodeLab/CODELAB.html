<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CodeLab - Learn to Code</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      background: #0a0a0f
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #fff
    }

    .inp {
      width: 100%;
      padding: .75rem;
      border-radius: .75rem;
      background: rgba(0, 0, 0, .5);
      border: 1px solid rgba(255, 255, 255, .1);
      margin-bottom: .75rem;
      color: #fff
    }

    .card {
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 1.5rem;
      padding: 1.5rem
    }

    .btn {
      padding: .6rem 1.2rem;
      border-radius: 9999px;
      font-weight: 600;
      background-color: #a707f1;
      color:white
    }

    .btn2 {
      padding: .5rem 1rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, .2)
    }

    .swal2-popup {
      background: #15151c !important;
      color: #fff !important
    }

    .swal2-html-container,
    .swal2-title {
      color: #fff !important
    }

    /* ===== OFFLINE OVERLAY ===== */
    #offlineOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0a0f;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    #offlineOverlay.show {
      display: flex;
    }

    #offlineOverlay svg {
      width: 180px;
      height: 180px;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out 13s infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-12px)
      }
    }

    #offlineOverlay .dot {
      animation: blink 1.4s infinite;
    }

    #offlineOverlay .dot:nth-child(2) {
      animation-delay: .2s
    }

    #offlineOverlay .dot:nth-child(3) {
      animation-delay: .4s
    }

    @keyframes blink {

      0%,
      100% {
        opacity: .2
      }

      50% {
        opacity: 1
      }
    }
  </style>
</head>

<body>
  <!-- Full-page offline cover: shown automatically when the browser loses connection -->
  <div id="offlineOverlay">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="cursor: pointer;">
      <circle cx="100" cy="100" r="90" fill="#15151c" stroke="red" stroke-width="3" opacity="1" />
      <path d="M55 90a45 30 0 0190 0" fill="none" stroke="#9333ea" stroke-width="6" stroke-linecap="round"
        opacity="1" />
      <path d="M70 105a25 18 0 0160 0" fill="none" stroke="#9333ea" stroke-width="6" stroke-linecap="round" />
      <circle cx="100" cy="130" r="8" fill="#9333ea" />
      <line x1="45" y1="55" x2="155" y2="150" stroke="white" stroke-width="6" stroke-linecap="round" />
    </svg>
    <h2 style="font-size:1.75rem;font-weight:700;margin-bottom:.5rem;">No internet connection</h2>
    <p style="color:rgba(255,255,255,.6);max-width:22rem;">CODELAB needs an active connection to load your
      DataBase. Check your Wi-Fi or Mobile data<span class="dot">.</span><span class="dot">...</span><span
        class="dot">.</span></p>
    <button onclick="location.reload()" class="btn" style="margin-top:1.5rem; cursor: pointer;border: none;">Try again</button>
  </div>

  <nav id="nav" class="flex justify-between items-center p-4 md:p-6 border-b border-white/10"></nav>
  <main id="main"></main>

  <div id="authModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
    <div class="bg-[#15151c] border border-white/10 rounded-3xl p-8 w-full max-w-md max-h-[95vh] overflow-y-auto">
      <div class="flex justify-between mb-4">
        <h3 id="mTitle" class="text-2xl font-bold"></h3><button onclick="closeAuth()" class="text-2xl">×</button>
      </div>
      <div id="roleRow" class="flex bg-black/50 rounded-full p-1 mb-4 text-sm"></div>
      <input id="a_name" class="inp" placeholder="Full name">
      <input id="a_email" type="email" class="inp" placeholder="Email">
      <input id="a_pw" type="password" class="inp" placeholder="Password (min 6 chars)">
      <select id="a_course" class="inp"></select>
      <input id="a_code" class="inp" placeholder="Admin access code">
      <button onclick="auth()" id="a_btn" class="btn w-full"></button>
      <div class="flex items-center gap-3 my-3">
        <div class="flex-1 h-px bg-white/10"></div><span class="text-xs text-white/40">or</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>
      <button onclick="googleAuth()" class="btn2 w-full flex items-center justify-center gap-2">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z" />
          <path fill="#FBBC05"
            d="M3.95 10.69A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.34z" />
          <path fill="#EA4335"
            d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z" />
        </svg>
        Continue with Google
      </button>
      <p id="a_err" class="text-red-400 text-sm mt-3 hidden"></p>
      <p class="text-center mt-2"><a href="#" onclick="event.preventDefault();resetPw()"
          class="text-xs text-white/40">Forgot password?</a></p>
      <p class="text-white/40 text-sm mt-3 text-center"><a href="#" id="a_sw" class="text-purple-400"></a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, collection, query, where, orderBy, limit, onSnapshot, runTransaction, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ===== CONFIG =====
    const firebaseConfig = {
      apiKey: "AIzaSyDNMHursDs-u-uneJbRhVNEfvW1VG_JFuY",
      authDomain: "codelab-ae70e.firebaseapp.com",
      projectId: "codelab-ae70e",
      storageBucket: "codelab-ae70e.firebasestorage.app",
      messagingSenderId: "200954216342",
      appId: "1:200954216342:web:45408297556fa4308027b7"
    };
    const PASS_MARK = 50, MIN_DAYS = 180, PRICE = 30000, MAX_ADMINS = 2, ADMIN_CODE = 'CODELAB-ADMIN';
    const COURSES = ['Python', 'AI LEARNING', 'Web Development', 'Programming', 'DATA Analysis'];
    const PAYSTACK_KEY = 'pk_test_2a34485ccc9767ef38045760c94a6d324c4b1d76';

    const fbApp = initializeApp(firebaseConfig), au = getAuth(fbApp), fs = getFirestore(fbApp);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const fmt = t => new Date(t).toLocaleString();
    const url = l => esc(/^https?:/.test(l) ? l : 'https://' + l);
    const fresh = () => ({ me: null, users: [], materials: [], tasks: [], subs: [], log: [], ann: [], classes: [], att: [], msgs: [] });
    let db = fresh(), unsubs = [], certBusy = false;

    // ===== OFFLINE DETECTION =====

    function setOffline(isOffline) {
      $('offlineOverlay').classList.toggle('show', isOffline);
    }
    window.addEventListener('offline', () => setOffline(true));
    window.addEventListener('online', () => { setOffline(false); toast('Back online', 'success'); });
    setOffline(!navigator.onLine); // page load

    function img(file, max) { return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const i = new Image(); i.onerror = rej; i.onload = () => { const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .75)) }; i.src = r.result }; r.readAsDataURL(file) }) }
    const av = (u, s = 40) => u?.avatar ? `<img src="${u.avatar}" class="rounded-full object-cover" style="width:${s}px;height:${s}px">` : `<div class="rounded-full bg-purple-600 flex items-center justify-center font-bold" style="width:${s}px;height:${s}px">${esc((u?.name || '?')[0].toUpperCase())}</div>`;
    const uref = () => doc(fs, 'users', au.currentUser.uid);
    const toast = (title, icon = 'success') => Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2200, timerProgressBar: true });
    const log = (action, u = db.me) => u ? addDoc(collection(fs, 'log'), { t: Date.now(), uid: u.uid, name: u.name, id: u.id, role: u.role, action }).catch(() => { }) : Promise.resolve();

    // ===== DERIVED =====
    const payment = u => u.paidAt ? { date: u.paidAt } : null;
    function prog(u) {
      const ms = db.materials.filter(m => m.course === u.course), ts = db.tasks.filter(t => t.course === u.course);
      const d = ms.filter(m => (u.done || []).includes(m.id)).length + ts.filter(t => db.subs.some(s => s.taskId === t.id && s.uid === u.uid)).length, total = ms.length + ts.length;
      return { total, d, pct: total ? Math.round(d / total * 100) : 0 };
    }
    function grades(u) { const s = db.subs.filter(x => x.uid === u.uid), g = s.filter(x => x.score != null); return { n: s.length, g: g.length, avg: g.length ? Math.round(g.reduce((a, x) => a + x.score, 0) / g.length) : null } }
    function attRate(u) { const a = db.att.filter(x => x.uid === u.uid); return a.length ? Math.round(a.filter(x => x.status === 'present').length / a.length * 100) : null }
    function eligibility(u) {
      const p = payment(u), pr = prog(u); if (!p) return { ok: false, days: 0, pr };
      const days = (Date.now() - p.date) / 864e5, g = grades(u), gradedOk = g.g === g.n && (g.avg === null || g.avg >= PASS_MARK);
      return { ok: pr.total > 0 && pr.pct === 100 && days >= MIN_DAYS && gradedOk, days, pr };
    }

    // ===== AUTH =====
    let A = { mode: 'signup', role: 'student' }, adminFull = false;
    async function openAuth(mode) {
      A.mode = mode; syncAuth(); $('authModal').classList.replace('hidden', 'flex');
      try { const m = await getDoc(doc(fs, 'meta', 'admins')); adminFull = (m.data()?.count ?? 0) >= MAX_ADMINS } catch { }
      if (adminFull && A.role === 'admin') A.role = 'student'; syncAuth();
    }
    const closeAuth = () => $('authModal').classList.replace('flex', 'hidden');
    const setRole = r => { A.role = r; syncAuth() };
    function syncAuth() {
      const su = A.mode === 'signup';
      $('mTitle').textContent = su ? 'Create Account' : 'Welcome Back'; $('a_btn').textContent = su ? 'Create Account' : 'Login';
      $('a_sw').textContent = su ? 'Already have an account? Log in' : 'New here? Sign up';
      $('a_sw').onclick = e => { e.preventDefault(); openAuth(su ? 'login' : 'signup') };
      $('roleRow').style.display = su ? 'flex' : 'none';
      $('roleRow').innerHTML = ['student', 'tutor', 'admin'].filter(r => r !== 'admin' || !adminFull).map(r => `<button onclick="setRole('${r}')" class="flex-1 py-2 rounded-full capitalize ${A.role === r ? 'bg-white text-black font-semibold' : 'text-white/60'}">${r}</button>`).join('');
      $('a_name').style.display = su ? '' : 'none';
      $('a_course').style.display = su && A.role !== 'admin' ? '' : 'none';
      $('a_course').innerHTML = `<option value="">Select ${A.role === 'tutor' ? 'the course you teach' : 'your course'}</option>` + COURSES.map(c => `<option>${c}</option>`).join('');
      $('a_code').style.display = su && A.role === 'admin' ? '' : 'none'; $('a_err').classList.add('hidden');
    }
    const aerr = m => { $('a_err').textContent = m; $('a_err').classList.remove('hidden'); toast(m, 'error') };
    async function auth() {
      const name = $('a_name').value.trim(), email = $('a_email').value.trim().toLowerCase(), pw = $('a_pw').value;
      if (!/^\S+@\S+\.\S+$/.test(email)) return aerr('Enter a valid email.');
      if (pw.length < 6) return aerr('Password must be at least 6 characters.');
      if (A.mode === 'login') {
        try { const c = await signInWithEmailAndPassword(au, email, pw); const s = await getDoc(doc(fs, 'users', c.user.uid)); if (s.exists()) { log('Logged in', s.data()); toast('Welcome back, ' + s.data().name + '!') } closeAuth() }
        catch { aerr('Incorrect email or password.') } return;
      }
      const role = A.role;
      if (!name) return aerr('Enter your name.');
      if (role !== 'admin' && !$('a_course').value) return aerr('Select a course.');
      if (role === 'admin' && $('a_code').value !== ADMIN_CODE) return aerr('Wrong admin access code.');
      let cred; try { cred = await createUserWithEmailAndPassword(au, email, pw) } catch (e) { return aerr(e.code === 'auth/email-already-in-use' ? 'Account already exists. Log in instead.' : e.message) }
      const u = { uid: cred.user.uid, id: (role === 'admin' ? 'CLA-' : role === 'tutor' ? 'CLM-' : 'CLS-') + Math.floor(1e5 + Math.random() * 9e5), name, email, role, course: role === 'admin' ? null : $('a_course').value, joined: Date.now(), done: [], avatar: null, cert: null, paidAt: null, active: true };
      const ref = doc(fs, 'users', u.uid);
      try {
        if (role === 'admin') await runTransaction(fs, async tx => { // atomic: two people can't both grab the last slot
          const m = doc(fs, 'meta', 'admins'), s = await tx.get(m), c = s.exists() ? s.data().count : 0;
          if (c >= MAX_ADMINS) throw new Error('LIMIT'); tx.update(m, { count: c + 1 }); tx.set(ref, u);
        }); else await setDoc(ref, u);
        log(`Signed up as ${role}${u.course ? ' (' + u.course + ')' : ''}`, u); closeAuth();
        Swal.fire({ title: `Welcome, ${u.name}!`, text: `Your CodeLab ID is ${u.id}. Keep it safe.`, icon: 'success' });
      } catch (e) { await cred.user.delete().catch(() => { }); aerr(e.message === 'LIMIT' ? `Admin limit reached: only ${MAX_ADMINS} admin accounts are allowed.` : 'Signup failed: ' + e.message) }
    }
    const googleProvider = new GoogleAuthProvider();
    async function googleAuth() {
      let role = A.role, course = A.role !== 'admin' ? $('a_course').value : null;
      if (A.mode === 'signup') {
        if (role !== 'admin' && !course) return aerr('Select a course first, then continue with Google.');
        if (role === 'admin' && $('a_code').value !== ADMIN_CODE) return aerr('Enter the admin access code first, then continue with Google.');
      }
      let cred; try { cred = await signInWithPopup(au, googleProvider) } catch (e) { return aerr('Google sign-in failed: ' + e.message) }
      const existing = await getDoc(doc(fs, 'users', cred.user.uid));
      if (existing.exists()) { log('Logged in', existing.data()); toast('Welcome back, ' + existing.data().name + '!'); closeAuth(); return }
      if (A.mode === 'login') { aerr('No CodeLab account for this Google account yet. Switch to Sign Up.'); return }
      const guessedName = cred.user.displayName || (cred.user.email ? cred.user.email.split('@')[0] : 'Student');
      const u = { uid: cred.user.uid, id: (role === 'admin' ? 'CLA-' : role === 'tutor' ? 'CLM-' : 'CLS-') + Math.floor(1e5 + Math.random() * 9e5), name: guessedName, email: cred.user.email, role, course: role === 'admin' ? null : course, joined: Date.now(), done: [], avatar: cred.user.photoURL || null, cert: null, paidAt: null, active: true };
      const ref = doc(fs, 'users', u.uid);
      try {
        if (role === 'admin') await runTransaction(fs, async tx => {
          const m = doc(fs, 'meta', 'admins'), s = await tx.get(m), c = s.exists() ? s.data().count : 0;
          if (c >= MAX_ADMINS) throw new Error('LIMIT'); tx.update(m, { count: c + 1 }); tx.set(ref, u);
        }); else await setDoc(ref, u);
        log(`Signed up as ${role}${u.course ? ' (' + u.course + ')' : ''}`, u); closeAuth();
        Swal.fire({ title: `Welcome, ${u.name}!`, text: `Your CodeLab ID is ${u.id}. Keep it safe.`, icon: 'success' });
      } catch (e) { aerr(e.message === 'LIMIT' ? `Admin limit reached: only ${MAX_ADMINS} admin accounts are allowed.` : 'Signup failed: ' + e.message) }
    }
    const logout = async () => {
      const r = await Swal.fire({ title: 'Log out?', icon: 'question', showCancelButton: true, confirmButtonText: 'Log out' });
      if (!r.isConfirmed) return;
      try { await log('Logged out') } catch { }   // never let logging block logout
      try { await signOut(au) } catch { }
      db = fresh(); render(); toast('Logged out', 'info');
    };

     //DATA
    function watch(name, q) { unsubs.push(onSnapshot(q, s => { db[name] = s.docs.map(d => d.data()); render() }, e => console.warn(name, e.message))) }
    function startWatch(u) {
      const C = n => collection(fs, n);
      if (u.role === 'admin') { watch('ann', C('announcements')); watch('classes', C('classes')); watch('att', C('attendance')); watch('users', C('users')); watch('materials', C('materials')); watch('tasks', C('tasks')); watch('subs', C('subs')); watch('log', query(C('log'), orderBy('t', 'desc'), limit(200))) }
      else {
        watch('materials', query(C('materials'), where('course', '==', u.course))); watch('tasks', query(C('tasks'), where('course', '==', u.course)));
        watch('ann', query(C('announcements'), where('course', 'in', [u.course, 'all']))); watch('msgs', query(C('messages'), where('course', '==', u.course))); watch('classes', query(C('classes'), where('course', '==', u.course)));
        watch('att', u.role === 'tutor' ? query(C('attendance'), where('course', '==', u.course)) : query(C('attendance'), where('uid', '==', u.uid)));
        if (u.role === 'tutor') { watch('users', query(C('users'), where('role', '==', 'student'), where('course', '==', u.course))); watch('subs', query(C('subs'), where('course', '==', u.course))) }
        else watch('subs', query(C('subs'), where('uid', '==', u.uid)));
      }
    }
    onAuthStateChanged(au, user => {
      unsubs.forEach(f => f()); unsubs = []; db = fresh(); render();
      if (!user) return; let started = false;
      unsubs.push(onSnapshot(doc(fs, 'users', user.uid), s => { db.me = s.exists() ? s.data() : null; if (db.me && !started) { started = true; startWatch(db.me) } render() }));
    });

    // ===== ACTIONS =====
    async function profile() {
      const u = db.me;
      const r = await Swal.fire({ title: 'Profile', html: `<div class="flex justify-center mb-3">${av(u, 96)}</div><input type="file" id="pf" accept="image/*" class="text-sm mb-3"><input id="pn" class="inp" placeholder="Full name" value="${esc(u.name)}">`, showCancelButton: true, confirmButtonText: 'Save', preConfirm: async () => { const f = $('pf').files[0], name = $('pn').value.trim(); if (!name) return Swal.showValidationMessage('Name cannot be empty'); return { name, avatar: f ? await img(f, 200) : undefined } } });
      if (r.isConfirmed) {
        const patch = { name: r.value.name }; if (r.value.avatar) patch.avatar = r.value.avatar;
        await updateDoc(uref(), patch); log('Updated profile'); toast('Profile updated');
      }
    }
    async function pay() {
      const u = db.me; if (!window.PaystackPop) return Swal.fire('Paystack failed to load', 'Check your connection or ad-blocker.', 'error');
      PaystackPop.setup({
        key: PAYSTACK_KEY, email: u.email, amount: PRICE * 100, currency: 'NGN', ref: 'CL_' + Date.now(), onClose() { toast('Payment cancelled', 'info') },
        callback(r) { addDoc(collection(fs, 'payments'), { uid: u.uid, amount: PRICE, ref: r.reference, date: Date.now() }); updateDoc(uref(), { paidAt: Date.now() }); log(`Paid ₦${PRICE.toLocaleString()} (ref ${r.reference})`); Swal.fire('Payment successful', 'Ref: ' + r.reference, 'success') }
      }).openIframe();
    }
    async function complete(id) { const u = db.me; if ((u.done || []).includes(id)) return; await updateDoc(uref(), { done: arrayUnion(id) }); log('Completed material: ' + db.materials.find(m => m.id === id)?.title); toast('Marked complete') }
    async function submitTask(id) {
      const u = db.me, t = db.tasks.find(x => x.id === id);
      const r = await Swal.fire({
        title: 'Submit proof', html: `<p class="text-sm text-white/60 mb-3">${esc(t.title)}</p><textarea id="sp_n" class="inp" rows="3" placeholder="Describe what you did (min 20 characters)"></textarea><input id="sp_l" class="inp" placeholder="Link to work (GitHub, Drive, live demo)"><label class="text-xs text-white/50">Or screenshot:</label><input type="file" id="sp_f" accept="image/*" class="text-sm">`, showCancelButton: true, confirmButtonText: 'Submit',
        preConfirm: async () => { const note = $('sp_n').value.trim(), link = $('sp_l').value.trim(), f = $('sp_f').files[0]; if (note.length < 20) return Swal.showValidationMessage('Write at least 20 characters describing your attempt'); if (!link && !f) return Swal.showValidationMessage('Add a link or screenshot as proof'); return { note, link, shot: f ? await img(f, 700) : null } }
      });
      if (!r.isConfirmed) return; const sid = uid('s');

  <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">${stat(st.length, 'Students')}${stat(us.filter(x => x.role === 'tutor').length, 'Tutors')}${stat(st.filter(payment).length, 'Paid students')}${stat('₦' + (st.filter(payment).length * PRICE).toLocaleString(), 'Revenue')}${stat(db.subs.length, 'Submissions')}${stat(st.filter(x => x.cert).length, 'Certified')}</div>
  <div class="grid lg:grid-cols-2 gap-6 mb-6"><div class="card">${annForm(true)}</div><div class="card"><h3 class="font-bold mb-3">Recent announcements</h3><div class="space-y-2">${annList()}</div><button onclick="exportCSV()" class="btn2 mt-4 text-sm">⬇ Export students (CSV)</button></div></div><div class="grid lg:grid-cols-2 gap-6"><div class="card overflow-x-auto"><h3 class="font-bold mb-3">All users</h3><table class="w-full text-sm text-left"><thead class="text-white/40"><tr><th class="py-2 pr-2"></th><th class="pr-3">Name</th><th class="pr-3">Role</th><th class="pr-3">Course</th><th>Progress</th><th>Attend.</th><th></th></tr></thead><tbody>${us.map(x => `<tr class="border-t border-white/5"><td class="py-2 pr-2">${av(x, 28)}</td><td class="pr-3">${esc(x.name)}<br><span class="text-xs text-white/40">${esc(x.email)}</span></td><td class="pr-3 capitalize">${x.role}</td><td class="pr-3">${esc(x.course || '—')}</td><td>${x.role === 'student' ? prog(x).pct + '%' + (payment(x) ? '' : ' (unpaid)') : '—'}</td><td>${x.role === 'student' ? (attRate(x) ?? '—') + (attRate(x) == null ? '' : '%') : ''}</td><td>${x.role !== 'admin' ? `<button class="text-xs ${x.active === false ? 'text-green-400' : 'text-red-400'}" onclick="toggleActive('${x.uid}', ${x.active === false})">${x.active === false ? 'Activate' : 'Suspend'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3 class="font-bold mb-3">Activity log (all tutors &amp; students)</h3><div class="space-y-2 max-h-[32rem] overflow-y-auto">${db.log.map(l => `<div class="text-sm border-b border-white/5 pb-2"><span class="font-semibold">${esc(l.name)}</span> <span class="text-xs px-2 rounded-full bg-white/10">${esc(l.role)}</span> ${esc(l.action)}<br><span class="text-xs text-white/40">${fmt(l.t)}</span></div>`).join('') || '<p class="text-white/40 text-sm">No activity yet.</p>'}</div></div></div></div>`;
    }
    function render(force) {
      const a = document.activeElement; if (!force && a && /INPUT|TEXTAREA/.test(a.tagName) && $('main').contains(a)) return;
      const u = db.me; $('nav').innerHTML = navHtml(u);
      $('main').innerHTML = !au.currentUser ? landing() : !u ? '<p class="text-center text-white/50 py-20">Loading... Wait </p>' : u.active === false ? '<p class="text-center text-red-400 py-20">Your Account has been suspended. Pls contact the Admin.</p>' : u.role === 'admin' ? adminV(u) : u.role === 'tutor' ? tutorV(u) : studentV(u);
      if (u?.role === 'student' && payment(u)) checkCert(u);
    }
    window.addEventListener('unhandledrejection', e => Swal.fire('Something went wrong', String(e.reason?.message || 'Please try again.'), 'error'));
    Object.assign(window, { openAuth, closeAuth, setRole, auth, googleAuth, logout, profile, pay, complete, submitTask, viewProof, addItem, showCert, resetPw, postAnn, postClass, markAtt, setAttDate, grade, toggleActive, exportCSV, sendMsg, delItem, verifyCert });
    render();
  </script>
</body>

</html>
